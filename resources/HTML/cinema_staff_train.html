<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>培训员工</title>
    <style>
        @font-face { font-family: miaomiao; src: url(./也字工厂喵喵体.ttf); }
        body {
            font-family: miaomiao, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            margin: 0;
            padding: 20px;
            color: #7a3b5c;
            position: relative;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border: 2px solid #ffc3da;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #e75490;
            font-size: 28px;
            margin: 0;
        }
        .content {
            text-align: center;
        }
        .big-heart {
            width: 52px;
            height: 48px;
            margin: 0 auto 20px;
            background: #ffb7d5;
            clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z');
        }
        .message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .level-up {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff8fbf, #ff6fae);
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .details {
            background: #fff0f7;
            border: 1px solid #ffd3e6;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .detail-item:last-child {
            margin-bottom: 0;
        }
        .detail-item span:first-child {
            color: #8a4a68;
        }
        .detail-item span:last-child {
            font-weight: bold;
            color: #d63384;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #8a4a68;
            font-size: 14px;
        }
        .deco {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }
        .deco-heart {
            width: 26px;
            height: 24px;
            background: #ffb7d5;
            clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z');
            opacity: 0.5;
            animation: floatUp 6s ease-in-out infinite;
        }
        .deco-star {
            width: 24px;
            height: 24px;
            background: #ffd98e;
            clip-path: polygon(50% 0%,63% 35%,100% 38%,71% 60%,82% 100%,50% 76%,18% 100%,29% 60%,0% 38%,37% 35%);
            opacity: 0.55;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 24px; left: 20px;"></div>
    <div class="deco deco-star" style="top: 70px; right: 24px;"></div>
    <div class="deco deco-heart" style="top: 130px; right: 48px; animation-delay: 1.2s;"></div>
    <div class="deco deco-star" style="top: 190px; left: 44px; animation-delay: 0.6s;"></div>
    <div class="container">
        <div class="header">
            <h1>培训员工成功</h1>
        </div>
        <div class="content">
            <div class="big-heart"></div>
            <div class="message">
                <span style="color: #e75490; font-weight: bold;">{{name}}</span> 的员工 <span style="color: #e75490; font-weight: bold;">{{staffName}}</span> 培训完成，等级提升啦！
            </div>
            <div class="level-up">{{oldLevel}}级 → {{newLevel}}级</div>
            <div class="details">
                <div class="detail-item">
                    <span>员工名称：</span>
                    <span>{{staffName}}</span>
                </div>
                <div class="detail-item">
                    <span>培训前等级：</span>
                    <span>{{oldLevel}}级</span>
                </div>
                <div class="detail-item">
                    <span>培训后等级：</span>
                    <span>{{newLevel}}级</span>
                </div>
                <div class="detail-item">
                    <span>当前效率：</span>
                    <span>{{efficiency}}</span>
                </div>
                <div class="detail-item">
                    <span>培训费用：</span>
                    <span>{{cost}}元</span>
                </div>
                <div class="detail-item">
                    <span>剩余金钱：</span>
                    <span>{{money}}元</span>
                </div>
            </div>
        </div>
        <div class="footer">
            员工效率提升后能为电影院带来更多收入
        </div>
    </div>
</body>
</html>
