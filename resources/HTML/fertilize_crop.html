<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>施肥成功</title>
    <style>
        @font-face { font-family: miaomiao; src: url(./也字工厂喵喵体.ttf); }
        body {
            font-family: miaomiao, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            margin: 0;
            padding: 20px;
            color: #7a3b5c;
            position: relative;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border: 2px solid #ffc3da;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #e75490;
            font-size: 28px;
            margin: 0;
        }
        .content {
            text-align: center;
        }
        .message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .fert-box {
            background: #fff0f7;
            border: 1px solid #ffd3e6;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
        }
        .fert-title {
            font-size: 15px;
            color: #8a4a68;
            margin-bottom: 12px;
        }
        .fert-change {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .fert-old {
            font-size: 26px;
            font-weight: bold;
            color: #b07a94;
        }
        .fert-arrow {
            font-size: 24px;
            font-weight: bold;
            color: #ff8fbf;
        }
        .fert-new {
            font-size: 34px;
            font-weight: bold;
            color: #e75490;
        }
        .progress {
            height: 22px;
            background: rgba(231,84,144,0.12);
            border-radius: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8fbf, #e75490);
            border-radius: 12px;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #d63384;
        }
        .details {
            background: #fff0f7;
            border: 1px solid #ffd3e6;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .detail-item span:first-child {
            color: #8a4a68;
        }
        .detail-item span:last-child {
            font-weight: bold;
            color: #d63384;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #8a4a68;
            font-size: 14px;
        }
        .deco {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }
        .deco-heart {
            width: 26px;
            height: 24px;
            background: #ffb7d5;
            clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z');
            opacity: 0.5;
            animation: floatUp 6s ease-in-out infinite;
        }
        .deco-star {
            width: 24px;
            height: 24px;
            background: #ffd98e;
            clip-path: polygon(50% 0%,63% 35%,100% 38%,71% 60%,82% 100%,50% 76%,18% 100%,29% 60%,0% 38%,37% 35%);
            opacity: 0.55;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 20px; left: 24px;"></div>
    <div class="deco deco-star" style="top: 64px; left: 60px; animation-delay: 0.4s;"></div>
    <div class="deco deco-heart" style="top: 96px; left: 18px; animation-delay: 1.1s;"></div>
    <div class="deco deco-star" style="top: 36px; left: 96px; animation-delay: 1.6s;"></div>
    <div class="deco deco-heart" style="top: 24px; right: 28px; animation-delay: 0.7s;"></div>
    <div class="deco deco-star" style="top: 72px; right: 64px; animation-delay: 0.9s;"></div>
    <div class="deco deco-heart" style="top: 108px; right: 20px; animation-delay: 1.8s;"></div>
    <div class="deco deco-star" style="top: 40px; right: 100px; animation-delay: 0.2s;"></div>
    <div class="deco deco-heart" style="bottom: 28px; left: 32px; animation-delay: 1.4s;"></div>
    <div class="deco deco-star" style="bottom: 76px; left: 72px; animation-delay: 1.0s;"></div>
    <div class="deco deco-heart" style="bottom: 112px; left: 22px; animation-delay: 0.5s;"></div>
    <div class="deco deco-star" style="bottom: 44px; left: 104px; animation-delay: 1.9s;"></div>
    <div class="deco deco-heart" style="bottom: 24px; right: 30px; animation-delay: 0.8s;"></div>
    <div class="deco deco-star" style="bottom: 68px; right: 68px; animation-delay: 1.3s;"></div>
    <div class="deco deco-heart" style="bottom: 104px; right: 24px; animation-delay: 0.3s;"></div>
    <div class="deco deco-star" style="bottom: 40px; right: 108px; animation-delay: 1.7s;"></div>
    <div class="container">
        <div class="header">
            <h1>施肥成功</h1>
        </div>
        <div class="content">
            <div class="message">
                <span style="color: #e75490; font-weight: bold;">{{farmName}}</span> 的 <span style="color: #e75490; font-weight: bold;">{{cropName}}</span> 施肥成功！
            </div>
            <div class="fert-box">
                <div class="fert-title">土壤肥力变化</div>
                <div class="fert-change">
                    <span class="fert-old">{{oldFertility}}</span>
                    <span class="fert-arrow">→</span>
                    <span class="fert-new">{{newFertility}}</span>
                </div>
                <div class="progress">
                    <div class="progress-fill" style="width: {{newFertility || 0}}%;"></div>
                </div>
                <div class="progress-text">当前肥力 {{newFertility}}%</div>
            </div>
            <div class="details">
                <div class="detail-item">
                    <span>作物名称：</span>
                    <span>{{cropName}}</span>
                </div>
                <div class="detail-item">
                    <span>地块编号：</span>
                    <span>{{plotIndex}} 号地块</span>
                </div>
                <div class="detail-item">
                    <span>使用肥料：</span>
                    <span>{{toolName}}</span>
                </div>
                <div class="detail-item" style="margin-bottom: 0;">
                    <span>工具剩余耐久：</span>
                    <span>{{toolDurability}}</span>
                </div>
            </div>
        </div>
        <div class="footer">
            使用 #我的农场 查看作物生长状态，记得按时浇水哦
        </div>
    </div>
</body>
</html>
