<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头像馆</title>
    <style>
        @font-face {
            font-family: miaomiao;
            src: url(./也字工厂喵喵体.ttf);
        }

        @keyframes neonGlow {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ff8fbf, 0 0 20px #ff8fbf, 0 0 25px #ff8fbf; }
            100% { text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 10px #ff8fbf, 0 0 15px #ff8fbf, 0 0 20px #ff8fbf; }
        }

        @keyframes hologramEffect {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            75% { transform: translateY(10px) rotate(-2deg); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .deco {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }

        .deco-heart {
            width: 34px;
            height: 34px;
            background: #ffb7d5;
            clip-path: polygon(50% 100%, 0 35%, 25% 0, 50% 20%, 75% 0, 100% 35%);
            animation: floatUp 3.5s ease-in-out infinite;
        }

        .deco-star {
            width: 26px;
            height: 26px;
            background: #ffd98e;
            clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: floatUp 4s ease-in-out infinite, twinkle 2s infinite;
        }

        body {
            font-family: miaomiao, sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #7a3b5c;
        }

        .gallery-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(255, 133, 183, 0.3);
            backdrop-filter: blur(10px);
            width: 800px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid #ffc3da;
        }

        .gallery-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff8fbf, #ffc3da, #ff8fbf);
            animation: hologramEffect 2s infinite;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(to bottom,
                rgba(255, 143, 191, 0),
                rgba(255, 143, 191, 0.1),
                rgba(255, 143, 191, 0));
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            color: #e75490;
            font-size: 32px;
            margin: 0;
            font-family: miaomiao, sans-serif;
            animation: neonGlow 2s infinite alternate;
        }

        .subtitle {
            color: #b07a95;
            font-size: 16px;
            margin: 10px 0;
        }

        .current-avatar {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding: 20px;
            background: rgba(255, 240, 246, 0.9);
            border-radius: 18px;
            border: 2px solid #ffc3da;
        }

        .current-avatar-title {
            color: #d63384;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 143, 191, 0.5);
        }

        .current-avatar-frame {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #ff8fbf, #ff6fae);
            animation: pulse 3s infinite;
        }

        .current-avatar-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffc3da;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            padding: 20px;
            background: rgba(255, 240, 246, 0.7);
            border-radius: 18px;
            border: 2px solid #ffc3da;
        }

        .avatar-item {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .avatar-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 133, 183, 0.4);
        }

        .avatar-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid #ffc3da;
        }

        .avatar-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 143, 191, 0.15),
                transparent
            );
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-item:hover::before {
            opacity: 1;
        }

        .avatar-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 5px;
            background: rgba(255, 227, 238, 0.9);
            color: #d63384;
            font-size: 12px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-item:hover .avatar-name {
            opacity: 1;
        }

        .cute-decoration {
            position: absolute;
            font-size: 24px;
            opacity: 0.7;
            animation: float 4s ease-in-out infinite;
            color: #ff8fbf;
            text-shadow: 0 0 10px rgba(255, 143, 191, 0.5);
        }

        .cute-decoration:nth-child(1) { top: 20px; right: 20px; animation-delay: 0s; }
        .cute-decoration:nth-child(2) { bottom: 20px; left: 20px; animation-delay: 1s; }
        .cute-decoration:nth-child(3) { top: 50%; right: 30px; animation-delay: 2s; }
        .cute-decoration:nth-child(4) { bottom: 40%; left: 30px; animation-delay: 3s; }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #e75490;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255, 143, 191, 0.5);
            animation: neonGlow 2s infinite alternate;
        }

        .usage-tip {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 240, 246, 0.9);
            border-radius: 15px;
            border: 2px solid #ffc3da;
            color: #b07a95;
            font-size: 14px;
        }

        .usage-tip span {
            color: #e75490;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 24px; left: 20px;"></div>
    <div class="deco deco-star" style="top: 70px; right: 24px;"></div>
    <div class="deco deco-heart" style="top: 130px; right: 48px; animation-delay: 1.2s;"></div>
    <div class="deco deco-star" style="top: 190px; left: 44px; animation-delay: 0.6s;"></div>
    <div class="gallery-container">
        <div class="scanline"></div>
        
        <span class="cute-decoration">✧</span>
        <span class="cute-decoration">⚡</span>
        <span class="cute-decoration">✦</span>
        <span class="cute-decoration">⭐</span>

        <div class="header">
            <h1 class="title">头像馆</h1>
            <p class="subtitle">选择你喜欢的头像展现自我</p>
        </div>

        <div class="current-avatar">
            <div class="current-avatar-title">当前头像</div>
            <div class="current-avatar-frame">
                <img class="current-avatar-image" src="{{cssFile}}/tx/{{currentAvatar}}" alt="当前头像">
            </div>
        </div>

        <div class="avatar-grid">
            {{each avatars avatar}}
            <div class="avatar-item">
                <img src="{{cssFile}}/tx/{{avatar}}" alt="{{avatar}}">
                <div class="avatar-name">{{avatar}}</div>
            </div>
            {{/each}}
        </div>

        <div class="usage-tip">
            使用方法：发送 <span>#设置模拟人生头像 头像名称</span> 即可更换头像
        </div>

        <div class="footer">
            ⚡ SIMS-PLUGIN v2.0 ⚡
        </div>
    </div>
</body>
</html>
