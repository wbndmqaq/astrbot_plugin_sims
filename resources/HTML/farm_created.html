<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农场创建成功</title>
    <link rel="stylesheet" href="farm.css">
    <style>
        @font-face { font-family: miaomiao; src: url(./也字工厂喵喵体.ttf); }

        :root {
            --primary-color: #e75490;
            --accent-color: #ff8fbf;
            --highlight-color: #ff6fae;
            --bg-dark: #fff0f6;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --hologram-glow: 0 8px 24px rgba(255, 133, 183, 0.3);
        }

        body {
            font-family: miaomiao, 'Sci-Fi', 'Arial', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            color: #7a3b5c;
        }

        .hologram-container {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ffc3da;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(255, 133, 183, 0.3);
        }

        .star {
            background: #ffb7d5;
        }

        .progress-bar::after {
            background: linear-gradient(90deg, #ff8fbf, #ff6fae);
        }

        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 133, 183, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 133, 183, 0.8); }
        }

        .deco {
            position: absolute;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }

        .deco-heart {
            width: 34px;
            height: 34px;
            background: #ffb7d5;
            clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z');
            animation: floatUp 6s ease-in-out infinite;
        }

        .deco-star {
            width: 28px;
            height: 28px;
            background: #ffd98e;
            clip-path: polygon(50% 0%,63% 35%,100% 38%,71% 60%,82% 100%,50% 76%,18% 100%,29% 60%,0% 38%,37% 35%);
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(10deg); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* 页面特定样式 */
        .farm-title {
            text-align: center;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(255, 143, 191, 0.8);
            margin-bottom: 30px;
            font-size: 2em;
        }

        .farm-image-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
        }

        .farm-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ffe3ee, #ffd3e6);
            position: relative;
        }

        .hologram-farm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250"><rect width="800" height="250" fill="%23ff8fbf" opacity="0.3"/><rect y="150" width="800" height="100" fill="%23ffb7d5" opacity="0.3"/><circle cx="400" cy="50" r="30" fill="%23ffd98e" opacity="0.8"/></svg>');
            background-size: cover;
            animation: hologram-flicker 5s infinite;
            border: 2px solid rgba(255, 143, 191, 0.5);
            border-radius: 10px;
        }

        .farm-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 2px solid #ffc3da;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(255, 133, 183, 0.3);
            padding: 20px;
            text-align: center;
            animation: glow-pulse 3s infinite;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .stat-card p {
            font-size: 24px;
            color: var(--highlight-color);
            margin: 0;
        }

        .guide-container {
            background: var(--glass-bg);
            border: 2px solid #ffc3da;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(255, 133, 183, 0.3);
            padding: 20px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        .guide-container h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .guide-container ul {
            list-style: none;
            padding: 0;
        }

        .guide-container li {
            margin: 15px 0;
            padding-left: 25px;
            position: relative;
        }

        .guide-container li::before {
            content: '🌟';
            position: absolute;
            left: 0;
            animation: float 2s infinite;
        }

        .welcome-message {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(45deg, rgba(255, 143, 191, 0.15), rgba(255, 183, 213, 0.15));
            border-radius: 18px;
            backdrop-filter: blur(5px);
        }

        .welcome-message h2 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .welcome-message p {
            color: #7a3b5c;
            font-size: 1.2em;
            margin: 0;
        }

        /* 星空背景生成 */
        .starry-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 6%; left: 4%;"></div>
    <div class="deco deco-star" style="top: 16%; right: 5%;"></div>
    <div class="deco deco-heart" style="bottom: 14%; left: 8%;"></div>
    <div class="deco deco-star" style="bottom: 8%; right: 10%;"></div>
    <!-- 星空背景 -->
    <div class="starry-bg" id="starryBg"></div>

    <!-- 主容器 -->
    <div class="hologram-container">
        <h1 class="farm-title">✨ 农场创建成功 ✨</h1>
        
        <div class="welcome-message">
            <h2>欢迎来到你的未来农场，{{userName}}！</h2>
            <p>你的科技农场「{{farmName}}」已经准备就绪，开启智慧种植之旅吧~</p>
        </div>

        <div class="farm-image-container">
            <div class="farm-image">
                <div class="hologram-farm"></div>
            </div>
        </div>

        <div class="farm-stats">
            <div class="stat-card">
                <h3>农场等级</h3>
                <p>1</p>
                <div class="progress-bar"></div>
            </div>
            <div class="stat-card">
                <h3>地块数量</h3>
                <p>{{plots}}</p>
            </div>
            <div class="stat-card">
                <h3>经验值</h3>
                <p>0/100</p>
                <div class="progress-bar"></div>
            </div>
        </div>

        <div class="guide-container">
            <h3>🤖 智能助手指南</h3>
            <ul>
                <li>使用 <strong>#农场商店</strong> 购买智能种子和科技农具</li>
                <li>使用 <strong>#种植 [种子名称] [地块编号]</strong> 开始智能种植</li>
                <li>使用 <strong>#浇水 [地块编号]</strong> 激活智能灌溉系统</li>
                <li>使用 <strong>#施肥 [地块编号]</strong> 启动营养补给系统</li>
                <li>使用 <strong>#收获 [地块编号]</strong> 收获成熟作物</li>
                <li>使用 <strong>#农场攻略</strong> 查看完整智能种植指南</li>
            </ul>
        </div>

        <!-- 机器人助手 -->
        <div class="robot-assistant">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='30' r='20' fill='%231E90FF'/><rect x='30' y='50' width='40' height='40' rx='5' fill='%231E90FF'/><circle cx='40' cy='25' r='5' fill='white'/><circle cx='60' cy='25' r='5' fill='white'/><path d='M40 35 Q50 45 60 35' stroke='white' fill='none' stroke-width='2'/></svg>" alt="机器人助手">
        </div>
    </div>

    <script>
        // 生成星空背景
        function createStarryBackground() {
            const starryBg = document.getElementById('starryBg');
            const numberOfStars = 100;
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starryBg.appendChild(star);
            }
        }
        
        // 页面加载完成后创建星空背景
        window.addEventListener('load', createStarryBackground);
    </script>
</body>
</html>
