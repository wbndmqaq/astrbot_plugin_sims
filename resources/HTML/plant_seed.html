
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨种植种子✨</title>
    <style>
        @font-face { font-family: miaomiao; src: url(./也字工厂喵喵体.ttf); }
        :root {
            --primary: #e75490;
            --secondary: #ff6fae;
            --accent: #ff8fbf;
            --dark: #fff0f6;
            --light: #7a3b5c;
        }

        @font-face {
            font-family: 'SciFi';
            src: url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        }

        body {
            font-family: miaomiao, 'SciFi', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            color: var(--light);
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .deco { position: absolute; pointer-events: none; opacity: 0.5; z-index: 0; }
        .deco-heart { width: 34px; height: 34px; background: #ffb7d5; clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z'); animation: floatUp 6s ease-in-out infinite; }
        .deco-star { width: 28px; height: 28px; background: #ffd98e; clip-path: polygon(50% 0%,63% 35%,100% 38%,71% 60%,82% 100%,50% 76%,18% 100%,29% 60%,0% 38%,37% 35%); animation: twinkle 3s ease-in-out infinite; }
        @keyframes floatUp { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(10deg); } }
        @keyframes twinkle { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

        h2 { color: #e75490; }

        .plant-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
        }

        .plant-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ff8fbf10" d="M0,0 L100,0 L100,100 L0,100 Z M20,20 L80,20 L80,80 L20,80 Z" stroke="%23ff8fbf30" stroke-width="0.5"/></svg>');
            opacity: 0.3;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary), 0 0 30px var(--secondary);
            position: relative;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--primary); }
            to { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--secondary); }
        }

        .plot-info {
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #ffc3da;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
        }

        .plot-status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
        }

        .status-icon {
            font-size: 1.5rem;
            margin-right: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .seed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .seed-card {
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 15px;
            border: 2px solid #ffc3da;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .seed-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255,133,183,0.5);
        }

        .seed-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, transparent 45%, var(--primary) 50%, transparent 55%);
            opacity: 0.3;
            transform: rotate(30deg);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .seed-icon {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px currentColor;
        }

        .seed-name {
            font-size: 1.2rem;
            color: #d63384;
            text-align: center;
            margin-bottom: 5px;
        }

        .seed-details {
            font-size: 0.9rem;
            color: #8a4a68;
            margin-bottom: 5px;
        }

        .season-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(90deg, #ff8fbf, #ff6fae);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            box-shadow: 0 0 10px var(--secondary);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 6%; left: 4%;"></div>
    <div class="deco deco-star" style="top: 16%; right: 5%;"></div>
    <div class="deco deco-heart" style="bottom: 14%; left: 8%;"></div>
    <div class="deco deco-star" style="bottom: 8%; right: 10%;"></div>
    <div class="plant-container">
        <h1>✨种植种子✨</h1>

        <div class="plot-info">
            <h2>选择要种植的地块: #{{plotId}}</h2>
            <div class="plot-status">
                <div class="status-item">
                    <span class="status-icon">🟫</span>
                    <span>地块类型: {{plotType}}</span>
                </div>
                <div class="status-item">
                    <span class="status-icon">💧</span>
                    <span>水分: {{waterLevel}}%</span>
                </div>
                <div class="status-item">
                    <span class="status-icon">🧪</span>
                    <span>肥力: {{fertilityLevel}}%</span>
                </div>
            </div>
        </div>

        <h2>选择种子:</h2>
        <div class="seed-grid">
            {{each seeds seed}}
            <div class="seed-card" data-seed-id="{{seed.id}}">
                <div class="seed-icon">{{seed.icon}}</div>
                <div class="seed-name">{{seed.name}}</div>
                <div class="seed-details">
                    <div>生长周期: {{seed.growthDays}}天</div>
                    <div>产量: {{seed.yield}}个</div>
                    <div>季节: {{seed.season.join(', ')}}</div>
                </div>
                {{if seed.isSeasonal}}
                <div class="season-tag">当季</div>
                {{/if}}
            </div>
            {{/each}}
        </div>

        <div class="footer">
            <p>⚡ 测试 ⚡</p>
        </div>
    </div>
</body>
</html>
