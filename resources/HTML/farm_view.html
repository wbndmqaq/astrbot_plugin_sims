
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨我的二次元农场✨</title>
    <style>
        @font-face { font-family: miaomiao; src: url(./也字工厂喵喵体.ttf); }
        :root {
            --primary: #e75490;
            --secondary: #ff6fae;
            --accent: #ff8fbf;
            --dark: #fff0f6;
            --light: #7a3b5c;
        }

        @font-face {
            font-family: 'SciFi';
            src: url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        }

        body {
            font-family: miaomiao, 'SciFi', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ee 45%, #ffd3e6 100%);
            color: var(--light);
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .deco { position: absolute; pointer-events: none; opacity: 0.5; z-index: 0; }
        .deco-heart { width: 34px; height: 34px; background: #ffb7d5; clip-path: path('M12 22 C4.5 15 0 10.5 0 6 C0 2.2 2.7 0 6 0 C8.8 0 11 1.8 12 4.2 C13 1.8 15.2 0 18 0 C21.3 0 24 2.2 24 6 C24 10.5 19.5 15 12 22 Z'); animation: floatUp 6s ease-in-out infinite; }
        .deco-star { width: 28px; height: 28px; background: #ffd98e; clip-path: polygon(50% 0%,63% 35%,100% 38%,71% 60%,82% 100%,50% 76%,18% 100%,29% 60%,0% 38%,37% 35%); animation: twinkle 3s ease-in-out infinite; }
        @keyframes floatUp { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(10deg); } }
        @keyframes twinkle { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

        h2 { color: #e75490; }

        .farm-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .farm-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ff8fbf10" d="M0,0 L100,0 L100,100 L0,100 Z M20,20 L80,20 L80,80 L20,80 Z" stroke="%23ff8fbf30" stroke-width="0.5"/></svg>');
            opacity: 0.3;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 30px;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary), 0 0 30px var(--secondary);
            position: relative;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--primary); }
            to { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--secondary); }
        }

        .farm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 18px;
            border: 2px solid #ffc3da;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
        }

        .farm-avatar {
            width: 80px;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="30" fill="%23ff8fbf"/><circle cx="50" cy="30" r="20" fill="%23fff0f7"/><circle cx="40" cy="25" r="5" fill="%23e75490"/><circle cx="60" cy="25" r="5" fill="%23e75490"/><path d="M40,50 Q50,60 60,50" stroke="%23d63384" stroke-width="3" fill="none"/></svg>');
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .plot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 40px 0;
            perspective: 1000px;
        }

        .plot {
            aspect-ratio: 1/1;
            background: #fff0f7;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            border: 2px solid #ffb7d5;
            box-shadow: 0 8px 24px rgba(255,133,183,0.3);
        }

        .plot:hover {
            transform: scale(1.1) rotateZ(5deg);
            box-shadow: 0 0 25px rgba(255,133,183,0.5), inset 0 0 15px rgba(255,111,174,0.3);
        }

        .plot::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, transparent 45%, var(--primary) 50%, transparent 55%);
            opacity: 0.5;
            transform: rotate(30deg);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .plot-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .crop-emoji {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px white;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-bars {
            width: 80%;
            margin-top: 15px;
        }

        .status-bar {
            height: 8px;
            background: rgba(231,84,144,0.12);
            border-radius: 4px;
            margin: 8px 0;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(231,84,144,0.15);
        }

        .water-bar { background: linear-gradient(90deg, #ff8fbf, #ff6fae); }
        .growth-bar { background: linear-gradient(90deg, #ffb7d5, #ff8fbf); }
        .health-bar { background: linear-gradient(90deg, #e75490, #ff6fae); }

        .farm-footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="deco deco-heart" style="top: 6%; left: 4%;"></div>
    <div class="deco deco-star" style="top: 16%; right: 5%;"></div>
    <div class="deco deco-heart" style="bottom: 14%; left: 8%;"></div>
    <div class="deco deco-star" style="bottom: 8%; right: 10%;"></div>
    <div class="farm-container">
        <h1>✨{{farm.name}}✨</h1>

        <div class="farm-header">
            <div class="farm-avatar"></div>
            <div class="farm-info">
                <h2>农场小助手</h2>
                <p>当前季节: {{currentSeason.name}} (◕‿◕✿)</p>
            </div>
            <div class="farm-stats">
                <div>🌱 等级: {{level}}</div>
                <div>📊 经验: {{currentExp}}/{{nextLevelExp}}</div>
                <div>🌾 地块: {{farm.land.plots.length}}块</div>
            </div>
        </div>

        <div class="plot-grid">
            {{each plotsData plot}}
            <div class="plot">
                <div class="plot-content">
                    {{if plot.crop}}
                    <div class="crop-emoji">{{plot.icon}}</div>
                    <div class="crop-name">{{plot.crop}}</div>
                    <div class="status-bars">
                        <div class="status-bar water-bar" style="width: {{plot.water}}%"></div>
                        <div class="status-bar growth-bar" style="width: {{plot.growthPercentage}}%"></div>
                        <div class="status-bar health-bar" style="width: {{plot.health}}%"></div>
                    </div>
                    {{else}}
                    <div class="crop-emoji">🟫</div>
                    <div class="crop-name">空地</div>
                    {{/if}}
                </div>
            </div>
            {{/each}}
        </div>

        <div class="farm-footer">
            <p>⚡ 测试 ⚡</p>
        </div>
    </div>
</body>
</html>
